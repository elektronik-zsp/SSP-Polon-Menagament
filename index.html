<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSP Polon — Serwis</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><div><div class="brand">SSP <span>POLON</span> <small>SERWIS 2.0</small></div><div id="site-label" class="muted">Obsługa i utrzymanie systemów sygnalizacji pożarowej</div></div><div class="header-actions"><span class="offline">● Praca lokalna / offline</span><button data-action="export">Eksport bazy</button><button data-action="backup">Utwórz kopię</button></div></header>
<div class="layout"><aside><nav id="navigation" aria-label="Nawigacja główna"></nav><div class="sidebar-note">Dane pozostają na tym komputerze.<br>Regularnie kopiuj folder aplikacji na osobny nośnik.</div></aside><main><div id="notification" role="status" aria-live="polite"></div><div id="content"><p>Otwieranie lokalnej bazy…</p></div></main></div>
<footer id="storage-status">Łączenie z plikiem bazy…</footer>
<dialog id="editor"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title"></h2><button type="button" data-action="close-modal" aria-label="Zamknij">×</button></div><div id="editor-fields"></div><div id="form-error" class="error" role="alert"></div><div id="editor-actions" class="dialog-actions"></div></form></dialog>
<input id="import-file" type="file" accept=".json,application/json" hidden>
<section id="print-area" aria-label="Protokół do druku"></section>
</body></html>
